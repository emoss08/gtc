# Per-table sink routing and transforms. Set SINK_CONFIG_FILE to this file's
# path. Without a config file, both Redis sinks mirror every table with
# default key patterns and no transforms.
#
# Table entries take two forms:
#   - a plain string: the key pattern (Redis sinks) or index name (Meilisearch)
#   - an object: key/index plus declarative transforms
#
# Transforms (per sink under `transform:`, or per table):
#   filter:       CEL expression; the event is delivered only when it is true.
#                 Variables: op ("INSERT"|"UPDATE"|"DELETE"|"TRUNCATE"|"READ"),
#                 schema, table, new (row data), old (previous data).
#                 Guard optional columns: '"status" in new && new.status == "live"'
#   drop_columns: removed from the event before the sink sees it
#   mask:         column -> strategy: redact | null | sha256 | hmac256 | last4
#                 hmac256 is a keyed sha256 (HMAC) using CDC_MASK_HMAC_KEY;
#                 unlike plain sha256 it cannot be reversed by hashing guessed
#                 inputs, while staying deterministic (joinable). Startup fails
#                 if hmac256 is used without the key set.
#
# Transforms are per sink: the stream sink can carry full rows while the
# search index receives masked ones. Masking runs before key generation, so
# don't build keys from masked columns.

redis_stream:
  sync_all: true
  default_key_pattern: "{{.Prefix}}:{{.Schema}}:{{.Table}}"
  tables:
    public.orders: "{{.Prefix}}:orders:{{.Field \"status\"}}"

redis_json:
  default_key_pattern: "{{.Prefix}}:{{.Schema}}:{{.Table}}:{{.Field \"id\"}}"
  transform:
    drop_columns: [password_hash]
  tables:
    public.users:
      key: "{{.Prefix}}:users:{{.Field \"id\"}}"
      mask:
        email: sha256
        phone: last4
    public.orders:
      key: "{{.Prefix}}:orders:{{.Field \"id\"}}"
      filter: 'new.status != "draft"'

meilisearch:
  transform:
    drop_columns: [password_hash, internal_notes]
  tables:
    public.products: products
    public.users:
      index: users
      mask:
        email: redact

# Webhook: one POST per event to WEBHOOK_URL. Set WEBHOOK_SIGNING_SECRET and
# verify X-GTC-Signature (HMAC-SHA256 over "<X-GTC-Timestamp>.<body>") on the
# receiving end. Deliveries carry X-GTC-Event-Id; dedupe on it, since delivery
# is at-least-once. Only table selection and transforms apply here — the
# destination is the single configured URL.
webhook:
  tables:
    public.orders:
      filter: 'new.status == "shipped"'
    public.users:
      mask:
        email: hmac256

# NATS: publishes to <NATS_SUBJECT_PREFIX>.<schema>.<table> by default, or the
# per-table `key` below. JetStream is used unless NATS_JETSTREAM=false, which
# makes publishing fire-and-forget. Subjects are sanitized: wildcards and
# whitespace from identifiers become underscores.
nats:
  sync_all: true
  tables:
    public.orders: "{{.Prefix}}.orders.{{.Field \"status\"}}"

# Transactional outbox: INSERTs into this table are published as messages to
# the Redis stream <stream_prefix>:<topic column value>, instead of the table
# being mirrored like data. The table is automatically excluded from the
# other sinks and from backfill. Requires REDIS_URL.
# outbox:
#   table: public.outbox
#   stream_prefix: events          # destination: events:<topic>
#   default_topic: ""              # used when a row's topic is null/empty
#   delete_after_publish: false    # delete rows once published
#   columns:                       # all optional; defaults shown
#     id: id                       # message id (consumers dedupe on this)
#     topic: topic                 # destination stream suffix
#     key: aggregate_id            # optional partition/aggregate key
#     payload: payload             # message body (jsonb/json/text)
#     event_type: event_type       # optional message type field
